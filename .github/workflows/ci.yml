name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint & format check
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: stash
          POSTGRES_PASSWORD: stash
          POSTGRES_DB: stash_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies (includes runtime)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (pytest.ini controls coverage)
        run: |
          pytest -q

      - name: Build production Docker image
        run: |
          docker build -t stash:ci .

  k8s-e2e:
    # Deploys the real manifests to a throwaway kind cluster and checks that
    # the app serves traffic and that Postgres data survives a pod restart.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: stash
          config: k8s/kind-config.yaml

      - name: Build image and load it into the cluster
        run: |
          docker build -t stash:pg .
          kind load docker-image stash:pg --name stash

      - name: Generate throwaway secrets
        run: |
          {
            echo "GROQ_API_KEY=ci-placeholder"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          } > k8s/secrets.env

      - name: Deploy
        run: |
          kubectl apply -k k8s/
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl rollout status deployment/stash --timeout=180s

      - name: Smoke test and persistence check
        run: |
          curl -fsS localhost:8081/healthz
          curl -fsS localhost:8081/readyz
          curl -fsS -X POST localhost:8081/api/auth/signup \
            -H 'Content-Type: application/json' -d '{"username":"ci-user","password":"ci-pass-123"}'
          kubectl delete pod postgres-0
          kubectl wait --for=condition=Ready pod/postgres-0 --timeout=120s
          # Pods can still look ready for a few seconds after Postgres comes
          # back (probes run every 5s), so retry. A lost user would never log in.
          for i in $(seq 1 30); do
            if curl -fsS -X POST localhost:8081/api/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"username":"ci-user","password":"ci-pass-123"}'; then
              echo; echo "login OK after Postgres restart (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "user did not survive the Postgres restart"; exit 1

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app=stash --tail=100
